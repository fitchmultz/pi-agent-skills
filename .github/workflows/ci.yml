name: Skills CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: skills-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    uses: fitchmultz/.github/.github/workflows/resolve-hosts.yml@54c687228d840506555801b9db038373e697d901 # fix/npm12-qualification
    with:
      automation-ref: 54c687228d840506555801b9db038373e697d901 # fix/npm12-qualification

  qualify:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        host: [official, fork]
    name: ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.host == 'fork' && 8 || 6 }}
    env:
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
      PI_COMPAT_FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: skills
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: 54c687228d840506555801b9db038373e697d901 # fix/npm12-qualification
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.host == 'fork'
        with:
          repository: fitchmultz/pi
          ref: ${{ needs.resolve.outputs.fork-ref }}
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: |
          PM="$(node -p 'require("./automation/package.json").packageManager')"
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq librsvg2-bin
      - name: Install D2
        run: |
          curl -fsSL https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/d2.tar.gz"
          printf '%s  %s\n' 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9 "$RUNNER_TEMP/d2.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/d2"
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP/d2"
          sudo install -m 755 "$(find "$RUNNER_TEMP/d2" -type f -name d2 -print -quit)" /usr/local/bin/d2
      - name: Build and pack the frozen fork
        if: matrix.host == 'fork'
        working-directory: fork
        env:
          FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
        run: |
          npm ci --ignore-scripts
          npm run hydrate:model-data
          npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$FORK_REF"
          git diff --exit-code
      - name: Full contracts and native skill consumers
        env:
          HOST: ${{ matrix.host }}
          VERSION: ${{ needs.resolve.outputs.official-version }}
        run: |
          target="$VERSION"
          if [[ "$HOST" == fork ]]; then target="$RUNNER_TEMP/fork-package"; fi
          node automation/scripts/qualify.mjs --repo pi-agent-skills --source "$GITHUB_WORKSPACE/skills" \
            --host "$HOST" --target "$target" --output "$GITHUB_WORKSPACE/evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-skills-${{ matrix.host }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
